name: Reverse Password Check
description: |
  Locate a password comparison in a binary, find the check function,
  extract the expected value or XOR key, and report the logic. Mirrors
  the CrackMe2 walkthrough from the classic "Reverse Engineering" article.

  Customize the success/failure string patterns for your target.
inputs:
  - {name: xor_key_hint, label: XOR key / hint bytes (literal), default: ""}
  - {name: binary_path, label: Binary (absolute path), path: true, default: ""}
  - {name: success_hint, label: Success string, default: "Great work|Correct|Congrats|Good work|Success"}
  - {name: failure_hint, label: Failure string, default: "No luck|Incorrect|Wrong|Try again|Bad"}
steps:
  # Phase 1: load and get shape
  - tool: open_binary
    args: {path: "{input.binary_path}"}
    save_as: opened
  - tool: list_segments
    args: {}
    save_as: segments
  - tool: list_procedures
    args: {}
    save_as: procedures

  # Phase 2: find the message strings
  - tool: search_strings
    args: {pattern: "{input.success_hint}", mode: regex, case_sensitive: false}
    save_as: success_strings
    on_error: continue
  - tool: search_strings
    args: {pattern: "{input.failure_hint}", mode: regex, case_sensitive: false}
    save_as: failure_strings
    on_error: continue

  # Phase 3: find the entry point and the input API
  - tool: search_procedures
    args: {pattern: "^(main|w?main|w?WinMain|WinMainCRTStartup|entry)$", mode: regex}
    save_as: entry_points
    on_error: continue
  - tool: search_strings
    args: {pattern: "GetDlgItemText|GetWindowText|scanf|gets|fgets|ReadLine", mode: regex}
    save_as: input_apis
    on_error: continue

  # Phase 4: find any XOR constants or reference tables
  # (these often sit in .rdata near the check function)
  - tool: search_bytes
    args: {pattern: "{input.xor_key_hint}", mode: literal}
    save_as: xor_key_candidate
    on_error: continue
  - tool: search_strings
    args: {pattern: "Messing_in_bytes|password|passwd|secret|key|flag", mode: regex, case_sensitive: false}
    save_as: secret_strings
    on_error: continue